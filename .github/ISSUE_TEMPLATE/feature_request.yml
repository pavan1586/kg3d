name: Feature request
description: Suggest a capability or an API change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out about your graph?
      description: >
        kg3d is built around insight rather than features, so the most useful
        framing is the question you want the picture to answer.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would it look like?
      description: An API sketch, a screenshot from another tool, or a description.

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried with the current API?

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Engine (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build packages
        run: npm run build

      - name: Build demo
        run: npm run build:demo

      # Catches the classic publish mistake: a `files` allowlist that omits
      # something the package needs, or ships something it shouldn't.
      - name: Verify publishable contents
        if: matrix.node == '22'
        run: |
          npm pack --dry-run -w @kg3d/core
          npm pack --dry-run -w @kg3d/react

      - name: Assert the browser bundle carries its licence notice
        if: matrix.node == '22'
        run: |
          test -f packages/core/dist/kg3d.global.js
          test -f packages/core/dist/kg3d.global.js.LICENSE.txt
          grep -q "three.js" packages/core/dist/kg3d.global.js.LICENSE.txt

  render:
    name: Headless render smoke test
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build && npm run build:demo

      # playwright is a devDependency, so the version is pinned by the lockfile
      # and this only fetches the matching browser binary.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Software rendering, so this runs on a plain GitHub runner with no GPU.
      # It catches shader-compilation and WebGL wiring regressions that unit
      # tests cannot see.
      - name: Render the demo and assert it drew something
        run: npm run test:render

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-smoke-screenshot
          path: smoke-render.png
          if-no-files-found: warn

  api:
    name: Service (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - run: pip install -e '.[dev,sql]'

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest -q

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build the service image
        uses: docker/build-push-action@v6
        with:
          context: services/api
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

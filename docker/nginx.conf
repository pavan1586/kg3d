server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable; the entry document never is.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy the API so the browser sees one origin and CORS never enters into it.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for the live-update stream.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # A first-time analytics or layout computation on a large graph can run
        # for a while; the default 60s read timeout would cut it off.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;
}

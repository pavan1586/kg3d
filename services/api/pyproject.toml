[project]
name = "kg3d-api"
version = "0.2.0"
description = "kg3d graph service — pluggable graph adapters, exact analytics, server-side 3D layout and live streaming for the kg3d WebGL client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pavan" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "networkx>=3.2",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/kg3d/kg3d"
Repository = "https://github.com/kg3d/kg3d"
Issues = "https://github.com/kg3d/kg3d/issues"
Documentation = "https://github.com/kg3d/kg3d/blob/main/docs/api.md"

[project.optional-dependencies]
sql = ["SQLAlchemy>=2.0"]
neo4j = ["neo4j>=5.20"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[project]
name = "kg3d-api"
version = "0.2.0"
description = "kg3d graph service — pluggable graph adapters, exact analytics, server-side 3D layout and live streaming for the kg3d WebGL client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pavan Kumar Medheramitla" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "networkx>=3.2",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/pavan1586/kg3d"
Repository = "https://github.com/pavan1586/kg3d"
Issues = "https://github.com/pavan1586/kg3d/issues"
Documentation = "https://github.com/pavan1586/kg3d/blob/main/docs/api.md"

[project.optional-dependencies]
sql = ["SQLAlchemy>=2.0"]
neo4j = ["neo4j>=5.20"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # B008 flags a function call in a default argument, which is FastAPI's
    # entire dependency-injection idiom: `adapter: GraphAdapter =
    # Depends(get_adapter)`. The call is evaluated once at import to build the
    # dependency graph, not per request, so the bug B008 exists to catch cannot
    # happen here.
    "B008",
]
